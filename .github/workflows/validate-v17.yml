name: Validate War Room v1.7.8
on:
  push:
    branches: [war-room-v1.7.8-live-intelligence-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest production base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work/base,work/app | Out-Null
          $tag=(gh release view --repo $env:GITHUB_REPOSITORY --json tagName | ConvertFrom-Json).tagName
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "WarRoom-App.zip" --dir work/base
          Expand-Archive -Path work/base/WarRoom-App.zip -DestinationPath work/app -Force
          if (-not (Test-Path work/app/index.html)) { $dirs=@(Get-ChildItem work/app -Directory); if($dirs.Count -eq 1){ Copy-Item "$($dirs[0].FullName)\*" work/app -Recurse -Force } }
          if(-not(Test-Path work/app/index.html)){ throw 'Production package missing index.html' }
      - name: Apply exact production upgrade path
        shell: pwsh
        run: |
          python build/patch.py work/app
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python build/v17_integrate.py work/app
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Validate live intelligence and hydration
        shell: pwsh
        run: |
          python -c "import re,pathlib,json; p=pathlib.Path('work/app'); h=(p/'index.html').read_text(encoding='utf-8'); s=re.findall(r'<script>(.*?)</script>',h,re.S); pathlib.Path('work/check.js').write_text('\n'.join(s),encoding='utf-8'); assert json.loads((p/'version.json').read_text(encoding='utf-8'))['version']=='1.7.8'; assert h.count('/* War Room v1.7 - TBC Phase 3 Raid Intelligence */')==1; assert h.count('/* War Room v1.7.8 - Spec Refresh Bridge */')==1; assert h.count('/* War Room v1.7.8 - ClassicArmory Refresh Reliability */')==1; assert '/armory?name=' in h and 'wr-party-confidence' in h"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $tests=@('work/check.js','build/raid_intelligence.js','build/spec_refresh.js','build/armory_refresh_adapter.js','build/raid_intelligence_ui.js')
          foreach($t in $tests){ node --check $t; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE} }
          $runs=@('build/raid_intelligence_test.js','build/spec_freshness_test.js','build/spec_refresh_test.js','build/armory_refresh_adapter_test.js','build/group_diagnostics_test.js','build/character_hydration_test.js')
          foreach($t in $runs){ node $t; if($LASTEXITCODE -ne 0){exit $LASTEXITCODE} }
      - name: Compile native launcher
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $src=(Resolve-Path 'build/WarRoomLauncher.cs').Path
          $out=(Join-Path (Resolve-Path 'work').Path 'WarRoomLauncher-test.exe')
          & $csc /nologo /target:winexe /optimize+ /reference:System.dll /reference:System.Windows.Forms.dll "/out:$out" "$src"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw 'Native launcher compilation failed' }
      - name: Validate updater parser and app mode
        shell: pwsh
        run: |
          $tokens=$null; $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'work/app/WarRoomUpdater.ps1'),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'Updater parser validation failed' }
          $ps=Get-Content work/app/WarRoomUpdater.ps1 -Raw
          if($ps -notmatch 'ArgumentList "--app"'){ throw 'Updater missing native app-mode launch' }
