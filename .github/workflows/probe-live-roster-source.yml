name: Probe live roster source
on:
  push:
    branches: [v1.7.28-model-proxy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe ClassicArmory client/API
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse, json
          def get(u,accept='*/*'):
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 WarRoomProbe/1.0','Accept':accept})
            with urllib.request.urlopen(req,timeout=20) as r:
              b=r.read(); print('FETCH',u,'status',r.status,'ct',r.headers.get('content-type'),'bytes',len(b)); return b.decode('utf-8','replace')
          js=get('https://classic-armory.org/static/js/client_guild.js?v=6cc042e')
          for m in re.finditer(r'/api/v1/guild',js):
            i=m.start(); print('APICTX',js[max(0,i-1400):i+2200].replace('\n',' '))
          candidates=[
            'https://classic-armory.org/api/v1/guild?region=us&flavor=tbc-anniversary&realm=dreamscythe&name=Me%20Not%20That%20Kind%20Of%20Orc',
            'https://classic-armory.org/api/v1/guild/us/tbc-anniversary/dreamscythe/Me%20Not%20That%20Kind%20Of%20Orc',
            'https://classic-armory.org/api/v1/guild?region=us&realm=dreamscythe&name=Me%20Not%20That%20Kind%20Of%20Orc&flavor=tbc-anniversary'
          ]
          for u in candidates:
            try:
              body=get(u,'application/json,*/*')
              print('BODY',u,body[:5000])
            except Exception as e: print('ERROR',u,repr(e))
          PY
