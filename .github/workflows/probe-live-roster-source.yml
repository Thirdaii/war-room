name: Probe live roster source
on:
  push:
    branches: [v1.7.28-model-proxy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe ClassicArmory client/API
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, json
          u='https://classic-armory.org/api/v1/guild'
          payload={'region':'us','realm':'dreamscythe','name':'Me Not That Kind Of Orc','flavor':'tbc-anniversary'}
          data=json.dumps(payload).encode()
          req=urllib.request.Request(u,data=data,method='POST',headers={'User-Agent':'Mozilla/5.0 WarRoomProbe/1.0','Content-Type':'application/json','Accept':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=30) as r:
              b=r.read().decode('utf-8','replace'); print('STATUS',r.status,'CT',r.headers.get('content-type'),'BYTES',len(b)); print('BODY_HEAD',b[:3000])
              obj=json.loads(b); roster=obj.get('roster') or (obj.get('guild') or {}).get('members') or (obj.get('guild') or {}).get('roster') or []
              print('ROSTER_COUNT',len(roster))
              lvl70=[m for m in roster if int(m.get('level') or 0)==70]
              print('LEVEL70_COUNT',len(lvl70))
              names={str(m.get('name') or m.get('character_name') or '').lower():m for m in roster}
              for n in ['Moanlet','Lolmopsfloor','Boomple','Bigkili','Misanthropi']:
                print('CHECK',n, json.dumps(names.get(n.lower()),ensure_ascii=False))
              print('SAMPLE70',json.dumps(lvl70[:10],ensure_ascii=False)[:5000])
          except Exception as e:
            print('ERROR',repr(e))
            if hasattr(e,'read'):
              try: print('ERRBODY',e.read().decode('utf-8','replace')[:5000])
              except: pass
          PY
