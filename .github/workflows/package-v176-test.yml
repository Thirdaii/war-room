name: Package War Room v1.7.26 3D Test
on:
  push:
    branches: [war-room-v1.7.26-character-model-viewer]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest production base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work/base,work/app | Out-Null
          $tag=(gh release view --repo $env:GITHUB_REPOSITORY --json tagName | ConvertFrom-Json).tagName
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "WarRoom-App.zip" --dir work/base
          Expand-Archive work/base/WarRoom-App.zip work/app -Force
          if(-not(Test-Path work/app/index.html)){ $d=@(Get-ChildItem work/app -Directory); if($d.Count -eq 1){Copy-Item "$($d[0].FullName)\*" work/app -Recurse -Force} }
      - name: Apply v1.7.26 3D upgrade
        shell: pwsh
        run: |
          python build/patch.py work/app
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python build/v17_integrate.py work/app
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Compile v1.7.26 native launcher
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $src=(Resolve-Path build/WarRoomLauncher.cs).Path
          $out=(Join-Path (Resolve-Path work/app).Path 'War Room.exe')
          & $csc /nologo /target:winexe /optimize+ /reference:System.dll /reference:System.Windows.Forms.dll "/out:$out" "$src"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Final package regression gate
        shell: pwsh
        run: |
          $h=Get-Content work/app/index.html -Raw
          $v=Get-Content work/app/version.json -Raw | ConvertFrom-Json
          if($v.version -ne '1.7.26'){throw 'Wrong package version'}
          foreach($x in @('WarRoomCharacterModelManifest','WarRoomCharacterModelStage','generateModels','CONTENT_PATH','wr-character-model-stage','/item-appearance?id=','wr-wow-tooltip','gemHtml','Enchant:','/item-icon?id=')){if(-not $h.Contains($x)){throw "Missing packaged marker: $x"}}
          if(-not(Test-Path 'work/app/War Room.exe')){throw 'Native launcher missing'}
          if((Get-Item 'work/app/War Room.exe').Length -lt 10000){throw 'Native launcher unexpectedly small'}
          python -c "import re,pathlib; h=pathlib.Path('work/app/index.html').read_text(encoding='utf-8'); pathlib.Path('work/check.js').write_text(chr(10).join(re.findall(r'<script>(.*?)</script>',h,re.S)),encoding='utf-8')"
          node --check work/check.js
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Build test ZIP
        shell: pwsh
        run: |
          if(Test-Path work/WarRoom-v1.7.26-3D-TEST.zip){Remove-Item work/WarRoom-v1.7.26-3D-TEST.zip -Force}
          Compress-Archive -Path work/app/* -DestinationPath work/WarRoom-v1.7.26-3D-TEST.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: WarRoom-v1.7.26-3D-TEST
          path: work/WarRoom-v1.7.26-3D-TEST.zip
          if-no-files-found: error
          retention-days: 7
