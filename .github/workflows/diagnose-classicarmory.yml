name: Diagnose Armory Data Sources
on:
  push:
    branches: [war-room-v1.7.9-classicarmory-parser-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download production roster and probe armory sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p work/app
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'WarRoom-App.zip' --dir work
          unzip -q work/WarRoom-App.zip -d work/app
          python - <<'PY'
          from pathlib import Path
          import re,json
          h=Path('work/app/index.html').read_text(encoding='utf-8')
          m=re.search(r'const\s+roster\s*=\s*(\[[\s\S]*?\]);',h)
          rows=json.loads(m.group(1)) if m else []
          names=[x.get('name','') for x in rows if x.get('level')==70][:16]
          Path('work/names.txt').write_text('\n'.join(names),encoding='utf-8')
          print('ROSTER SAMPLE:',names)
          PY
          printf 'classic-armory.org: '; curl -L -sS -o /dev/null -w '%{http_code}\n' -A 'Mozilla/5.0' https://classic-armory.org/ || true
          printf 'classicarmory.gg: '; curl -L -sS -o /dev/null -w '%{http_code}\n' -A 'Mozilla/5.0' https://classicarmory.gg/ || true
          echo '=== roster character probes ==='
          while read -r name; do
            [ -z "$name" ] && continue
            slug=$(python -c 'import sys,unicodedata,re; s=unicodedata.normalize("NFKD",sys.argv[1]); s="".join(c for c in s if not unicodedata.combining(c)); print(re.sub(r"[^a-z0-9]+","-",s.lower()).strip("-"))' "$name")
            url="https://classicarmory.gg/character/us/dreamscythe/$slug?ns=classicann"
            code=$(curl -L -sS -o work/char.html -w '%{http_code}' -A 'Mozilla/5.0' "$url" || true)
            title=$(grep -oE '<title>[^<]+' work/char.html | head -n1 | sed 's/<title>//' || true)
            echo "$name -> $code | $title"
            if [ "$code" = "200" ] && ! grep -qiE 'Character not found|Something went wrong' work/char.html; then
              echo "FOUND: $url"
              grep -oE '.{0,100}(GearScore|Item Level|ilvl|specialization|talent|equipment|spec).{0,180}' work/char.html | head -n 50 || true
              break
            fi
          done < work/names.txt
