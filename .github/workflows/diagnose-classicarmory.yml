name: Diagnose Armory Data Sources
on:
  push:
    branches: [war-room-v1.7.9-classicarmory-parser-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download production roster and probe armory sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p work/app
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'WarRoom-App.zip' --dir work
          unzip -q work/WarRoom-App.zip -d work/app
          echo '=== ROSTER SOURCE HINTS ==='
          grep -nE 'roster\s*=|members\s*=|guild.*=|const .*players|name:' work/app/index.html | head -n 80 || true
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('work/app/index.html').read_text(encoding='utf-8')
          # Prefer object records that look like actual raiders: name + class + rank/race nearby.
          names=[]
          for m in re.finditer(r'\{[^{}]{0,500}?name\s*:\s*["\']([^"\']+)["\'][^{}]{0,500}?\}',h):
              block=m.group(0)
              if re.search(r'\bclass\s*:',block) and (re.search(r'\brank\s*:',block) or re.search(r'\brace\s*:',block)):
                  names.append(m.group(1))
          # Fallback for compact tuple-style seed rows.
          if not names:
              for m in re.finditer(r'\[\s*["\']([^"\']+)["\']\s*,\s*["\'][^"\']+["\']\s*,\s*70\s*,\s*["\'](?:Warrior|Paladin|Hunter|Rogue|Priest|Shaman|Mage|Warlock|Druid)["\']',h):
                  names.append(m.group(1))
          seen=[]
          for n in names:
              if n not in seen: seen.append(n)
          seen=seen[:12]
          Path('work/names.txt').write_text('\n'.join(seen),encoding='utf-8')
          print('ROSTER SAMPLE:',seen)
          PY
          echo '=== source status ==='
          printf 'classic-armory.org: '; curl -L -sS -o /dev/null -w '%{http_code}\n' -A 'Mozilla/5.0' https://classic-armory.org/ || true
          printf 'classicarmory.gg: '; curl -L -sS -o /dev/null -w '%{http_code}\n' -A 'Mozilla/5.0' https://classicarmory.gg/ || true
          echo '=== roster character probes ==='
          while read -r name; do
            [ -z "$name" ] && continue
            slug=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g;s/^-|-$//g')
            url="https://classicarmory.gg/character/us/dreamscythe/$slug?ns=classicann"
            code=$(curl -L -sS -o work/char.html -w '%{http_code}' -A 'Mozilla/5.0' "$url" || true)
            echo "$name -> $code"
            if [ "$code" = "200" ] && ! grep -qi 'Character not found' work/char.html; then
              echo "FOUND: $url"
              grep -oE '.{0,100}(GearScore|Item Level|ilvl|specialization|talent|equipment|spec).{0,160}' work/char.html | head -n 40 || true
              break
            fi
          done < work/names.txt
