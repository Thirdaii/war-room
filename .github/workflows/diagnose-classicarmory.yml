name: Diagnose Armory Data Sources
on:
  push:
    branches: [war-room-v1.7.9-classicarmory-parser-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace alternate armory API route
        run: |
          set -e
          curl -LfsS -A 'Mozilla/5.0' 'https://classicarmory.gg/character/us/dreamscythe/misanthropi?ns=classicann' -o work.html
          js=$(grep -oE 'src="/assets/index-[^"]+\.js"' work.html | head -n1 | cut -d'"' -f2)
          echo "BUNDLE: $js"
          curl -LfsS -A 'Mozilla/5.0' "https://classicarmory.gg$js" -o work.js
          echo '=== endpoint hints ==='
          grep -oE '.{0,180}(https?://[^"'"'"' ]+|/api/[^"'"'"' ]+|character[^"'"'"' ]{0,120}|equipment[^"'"'"' ]{0,120}|specialization[^"'"'"' ]{0,120}|talent[^"'"'"' ]{0,120}).{0,220}' work.js | head -n 250 || true
          echo '=== fetch/axios hints ==='
          grep -oE '.{0,220}(fetch\(|axios|baseURL|api\.battle|api/character|profile/wow).{0,260}' work.js | head -n 200 || true
