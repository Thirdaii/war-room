name: Diagnose Armory Data Sources
on:
  push:
    branches: [war-room-v1.7.9-classicarmory-parser-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect structured armory JSON
        run: |
          set -e
          curl -LfsS -A 'Mozilla/5.0' -H 'Accept: application/json' 'https://classicarmory.gg/api/character/us/dreamscythe/Misanthropi?ns=classicann' -o character.json
          python - <<'PY'
          import json
          d=json.load(open('character.json',encoding='utf-8'))
          print('TOP KEYS:', sorted(d.keys()))
          for k in ('name','displayName','class','className','race','level','spec','specialization','itemLevel','gearScore','lastLogin','flavor'):
              if k in d: print(k,':',d[k])
          print('TALENTS:', json.dumps(d.get('talents'),ensure_ascii=False)[:2500])
          eq=d.get('equipment') or {}
          print('EQUIPMENT TYPE:', type(eq).__name__, 'COUNT:', len(eq) if hasattr(eq,'__len__') else '?')
          if isinstance(eq,dict):
              for slot,item in list(eq.items())[:4]: print('SLOT',slot, json.dumps(item,ensure_ascii=False)[:1800])
          PY
