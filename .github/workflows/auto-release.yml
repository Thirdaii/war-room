name: Auto Publish War Room
on:
  push:
    branches: [main]
    paths:
      - build/version.txt
      - build/patch.py
      - build/WarRoomLauncher.cs
      - build/v178_launcher_patch.py
      - build/v178_integrate.py
      - build/v17_integrate.py
      - build/raid_intelligence.js
      - build/raid_intelligence_ui.js
      - build/raid_intelligence.css
      - build/tbc_phase3_rules.json
      - build/phase3_boss_profiles.json
      - .github/workflows/auto-release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        shell: pwsh
        run: |
          $version = (Get-Content build/version.txt -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Download current base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force work/base,work/app | Out-Null
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --limit 20 --json tagName | ConvertFrom-Json
          $baseTag = ($releases | Where-Object { $_.tagName -ne $env:TARGET_TAG } | Select-Object -First 1).tagName
          if (-not $baseTag) { throw "No base War Room release found." }
          gh release download $baseTag --repo $env:GITHUB_REPOSITORY --pattern "WarRoom-App.zip" --dir work/base
          Expand-Archive -Path work/base/WarRoom-App.zip -DestinationPath work/app -Force
          if (-not (Test-Path work/app/index.html)) {
            $dirs = @(Get-ChildItem work/app -Directory)
            if ($dirs.Count -eq 1) {
              Copy-Item "$($dirs[0].FullName)\*" work/app -Recurse -Force
              Remove-Item $dirs[0].FullName -Recurse -Force
            }
          }
          if (-not (Test-Path work/app/index.html)) { throw "Base package did not contain index.html." }

      - name: Apply and validate upgrade
        shell: pwsh
        run: |
          python build/patch.py work/app
          python build/v17_integrate.py work/app
          python build/v178_integrate.py work/app
          python -c "import json,re,pathlib; r=pathlib.Path('work/app'); expected=pathlib.Path('build/version.txt').read_text(encoding='utf-8').strip(); assert json.loads((r/'version.json').read_text(encoding='utf-8'))['version']==expected; h=(r/'index.html').read_text(encoding='utf-8'); s=re.findall(r'<script>(.*?)</script>',h,re.S); assert s; pathlib.Path('work/check.js').write_text('\n'.join(s),encoding='utf-8'); assert 'WarRoomRaidIntelligence' in h and 'wrRaidIntelLive' in h; assert "VIEWER_SRC='/modelviewer/classic/viewer/viewer.min.js'" in h; assert "CONTENT=location.origin+'/modelviewer/classic/'" in h; assert '/item-appearance?id=' in h"
          node --check work/check.js
          node --check build/raid_intelligence.js
          node --check build/raid_intelligence_ui.js
          python -c "import json,pathlib; d=json.loads(pathlib.Path('build/tbc_phase3_rules.json').read_text(encoding='utf-8')); b=json.loads(pathlib.Path('build/phase3_boss_profiles.json').read_text(encoding='utf-8')); assert d['raid_size']==25 and d['phase']==3; assert 'Illidan Stormrage' in d['raids']['Black Temple']['bosses']; assert 'Archimonde' in d['raids']['Battle for Mount Hyjal']['bosses']; assert b['profiles']['Illidan Stormrage']['raid']=='Black Temple'"
          $tokens=$null
          $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'work/app/WarRoomUpdater.ps1'),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "WarRoomUpdater.ps1 failed PowerShell syntax validation."
          }

      - name: Build native War Room launcher
        shell: pwsh
        run: |
          python build/v178_launcher_patch.py
          $launcher = Get-Content build/WarRoomLauncher.cs -Raw
          foreach ($required in @('/item-appearance','/modelviewer/classic/','HandleItemAppearance','HandleModelViewerProxy','modelViewerProxy','itemAppearances')) {
            if (-not $launcher.Contains($required)) { throw "Patched launcher missing $required" }
          }
          $icon = (Resolve-Path "work/app/assets/icons/WarRoom.ico").Path
          $source = (Resolve-Path "build/WarRoomLauncher.cs").Path
          $output = (Join-Path (Resolve-Path "work/app").Path "War Room.exe")
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "C# compiler not found: $csc" }
          & $csc /nologo /target:winexe /optimize+ /reference:System.dll /reference:System.Windows.Forms.dll "/win32icon:$icon" "/out:$output" "$source"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $output)) { throw "War Room.exe build failed." }

      - name: Package
        shell: pwsh
        run: |
          Remove-Item work/app/WarRoomUpdater.log,work/app/WarRoomLauncher.log -ErrorAction SilentlyContinue
          Remove-Item work/app/backups -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path work/app/* -DestinationPath work/WarRoom-App.zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path 'work/WarRoom-App.zip'))
          $names=@($zip.Entries | ForEach-Object { $_.FullName.Replace('\\','/') })
          $zip.Dispose()
          if ($names -notcontains 'index.html') { throw 'Package missing index.html.' }
          if ($names -notcontains 'War Room.exe') { throw 'Package missing War Room.exe.' }
          if ($names -notcontains 'WarRoomUpdater.ps1') { throw 'Package missing updater.' }

      - name: Publish latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG work/WarRoom-App.zip --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --title "War Room v$env:VERSION" --latest
          } else {
            gh release create $env:TAG work/WarRoom-App.zip --repo $env:GITHUB_REPOSITORY --title "War Room v$env:VERSION" --generate-notes --latest
          }
